<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SKYCUBE Games - Digital Sky Infrastructure simulations">
    <title>Games - SKYCUBE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="container">
            <div class="nav-wrapper">
                <div class="logo">
                    <a href="index.html" id="logo-link">
                        <img src="images/SkyCube_logo.png" alt="SKYCUBE" id="logo-image">
                    </a>
                </div>
                <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-menu" id="nav-menu">
                    <!-- Navigation items will be loaded dynamically -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Games Section -->
    <section class="games-page page-section" id="games">
        <div class="container">
            <div class="games-hero">
                <span class="games-kicker">SKYCUBE LABS</span>
                <h1 class="section-title">Games</h1>
                <p class="section-description">디지털 스카이 인프라의 개념을 짧은 시뮬레이션으로 체험해 보세요.</p>
            </div>

            <div class="games-grid" aria-label="Playable SKYCUBE games">
                <article class="game-card">
                    <div class="game-preview airtaxi-preview" aria-hidden="true">
                        <span class="preview-cloud cloud-one"></span>
                        <span class="preview-cloud cloud-two"></span>
                        <span class="airtaxi-route"></span>
                        <span class="airtaxi-vehicle"></span>
                        <span class="city-block block-one"></span>
                        <span class="city-block block-two"></span>
                        <span class="city-block block-three"></span>
                    </div>
                    <div class="game-card-content">
                        <div class="game-card-meta">
                            <span>UAM Operations</span>
                            <span>Demo</span>
                        </div>
                        <h2>에어택시 운항 시뮬레이터</h2>
                        <p>승객 수송, 노선 선택, 통행료와 수익 관리를 통해 미래 도심항공교통 운영을 체험합니다.</p>
                        <a class="btn btn-primary" href="games/airtaxi_game/airtaxi_game.html">Play Game</a>
                    </div>
                </article>

                <article class="game-card">
                    <div class="game-preview skybuilding-preview" aria-hidden="true">
                        <span class="sun-disc"></span>
                        <span class="tower tower-one"></span>
                        <span class="tower tower-two"></span>
                        <span class="tower tower-three"></span>
                        <span class="rights-line rights-one"></span>
                        <span class="rights-line rights-two"></span>
                    </div>
                    <div class="game-card-content">
                        <div class="game-card-meta">
                            <span>Air Rights</span>
                            <span>New</span>
                        </div>
                        <h2>맨하탄 스카이빌딩 시뮬레이터</h2>
                        <p>공중권을 사고 건물을 성장시키며, 도시 상공의 개발권이 어떻게 전략 자산이 되는지 경험합니다.</p>
                        <a class="btn btn-primary" href="games/skybuilding_game/skybuilding_game.html">Play Game</a>
                    </div>
                </article>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <div class="footer-logo">
                        <span id="footer-logo-text">SKYCUBE</span>
                    </div>
                    <p id="footer-copyright">© 2025 SKYCUBE. All rights reserved.</p>
                </div>
                <div class="footer-social" id="footer-social">
                    <!-- Social links will be loaded dynamically -->
                </div>
            </div>
        </div>
    </footer>

    <!-- Back to Top Button -->
    <button class="back-to-top" id="back-to-top" aria-label="Back to top">↑</button>

    <!-- Load configuration and data files first -->
    <script src="config.js"></script>
    <script src="news.js"></script>
    <!-- Then load main application script -->
    <script src="main.js"></script>
</body>
</html>
